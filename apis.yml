aid: hermeus
name: Hermeus
description: >-
  Hermeus is an American aerospace and defense company building rapidly reusable
  high-Mach and hypersonic aircraft for national-security missions in partnership
  with the U.S. Department of Defense. Founded in 2018 and headquartered in
  Atlanta, Georgia, the company applies a hardware-rich, rapid design-build-test
  approach to move quickly from concept to flight. Its programs include
  Quarterhorse, a reusable high-speed flight-test aircraft; Darkhorse, a
  multi-mission reusable hypersonic uncrewed aerial system (UAS); and Chimera, a
  hybrid turbine-based combined-cycle engine that transitions from turbojet
  takeoff through supersonic flight into hypersonic acceleration. Hermeus is a
  hardware manufacturer with no public developer API, SDK, or documentation
  surface; this profile tracks the company's public web, security, and corporate
  properties in the API Evangelist network.
